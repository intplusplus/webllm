<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>织造 · 单机流程 demo</title>
<style>
:root{
  --bg:#121211;--panel:#1a1a18;--panel2:#222220;--panel3:#2a2a27;
  --line:#33332e;--line2:#43433c;
  --txt:#ececea;--mut:#9f9f98;--dim:#6d6d66;
  --p:#afa9ec;--pbg:#2a2750;--pb:#7f77dd;
  --t:#5dcaa5;--tbg:#0f3329;--tb:#1e6b53;
  --b:#85b7eb;--bbg:#10304c;--bb:#245b8a;
  --a:#ef9f27;--abg:#3a2a0c;--ab:#7a5514;
  --r:#e24b4a;--rbg:#3a1616;--rb:#7a2b2b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.app{display:grid;grid-template-columns:212px 1fr;height:100vh;overflow:hidden}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;padding:14px 11px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 7px 12px}
.brand .mark{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#7f77dd,#5dcaa5);flex:0 0 auto}
.brand b{font-size:13.5px;font-weight:500}
.brand span{display:block;font-size:10.5px;color:var(--dim);margin-top:-2px}
.grp{font-size:10px;color:var(--dim);letter-spacing:.8px;padding:12px 8px 5px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;cursor:pointer;padding:6px 9px;border-radius:8px;color:var(--mut);display:flex;align-items:center;gap:8px;font-size:12.5px}
.nav button:hover{background:var(--panel2);color:var(--txt)}
.nav button.on{background:var(--pbg);color:#e6e3ff}
.nav .n{width:15px;height:15px;border-radius:50%;background:var(--panel3);color:var(--dim);font-size:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.nav button.on .n{background:var(--pb);color:#14140f}
.rail .foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line)}
.rail .foot .l1{font-size:10px;color:var(--dim)}
.rail .foot .l2{font-size:11.5px;color:var(--mut);margin-top:2px}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.topbar h1{font-size:14.5px;font-weight:500;margin:0}
.topbar .sub{font-size:10.5px;color:var(--dim)}
.spacer{flex:1}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.chip.t{background:var(--tbg);border-color:var(--tb);color:#a7efd4}
.chip.a{background:var(--abg);border-color:var(--ab);color:#f6cf8c}
.chip.p{background:var(--pbg);border-color:#4a4582;color:#cfcaff}
button.btn{all:unset;cursor:pointer;font-size:12px;padding:6px 12px;border-radius:8px;background:var(--pbg);color:#ded9ff;border:1px solid #4a4582;white-space:nowrap}
button.btn:hover{background:#34306a}
button.btn.ghost{background:transparent;color:var(--mut);border-color:var(--line2)}
button.btn.ghost:hover{color:var(--txt);background:var(--panel2)}
button.btn.sm{font-size:11px;padding:4px 9px}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.scroll{overflow:auto;padding:18px;flex:1 1 auto}
.view{display:none}.view.on{display:block}
h2.sec{font-size:11.5px;font-weight:500;color:var(--dim);letter-spacing:.6px;margin:0 0 10px}
h2.sec:not(:first-child){margin-top:22px}
.note{font-size:11px;color:var(--dim);margin-top:8px}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
.card.pad0{padding:0;overflow:hidden}
.card .big{font-size:21px;font-weight:500;letter-spacing:.4px}
.card .cap{font-size:10.5px;color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;color:var(--mut)}
.kv b{color:var(--txt);font-weight:400;text-align:right}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.tag.p{background:var(--pbg);color:#cfcaff;border-color:#4a4582}
.tag.t{background:var(--tbg);color:#a7efd4;border-color:var(--tb)}
.tag.b{background:var(--bbg);color:#bfdcf7;border-color:var(--bb)}
.tag.a{background:var(--abg);color:#f6cf8c;border-color:var(--ab)}
.tag.r{background:var(--rbg);color:#f3aeae;border-color:var(--rb)}
.anchor{margin-top:22px;font-size:10.5px;color:var(--dim);border-top:1px dashed var(--line2);padding-top:9px}
.anchor b{color:var(--p);font-weight:400}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.okbox{background:var(--tbg);border:1px solid var(--tb);border-radius:9px;padding:9px 11px;font-size:11.5px;color:#a7efd4}
.warnbox{background:var(--abg);border:1px solid var(--ab);border-radius:9px;padding:9px 11px;font-size:11.5px;color:#f6cf8c}
.badbox{background:var(--rbg);border:1px solid var(--rb);border-radius:9px;padding:9px 11px;font-size:11.5px;color:#f3aeae}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);color:var(--mut)}
.tabs button.on{border-color:var(--pb);background:var(--pbg);color:#dedeff}
.frm{display:flex;flex-direction:column;gap:12px}
.f{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.f .lb{font-size:12px;font-weight:500;margin-bottom:2px}
.f .hint{font-size:10.5px;color:var(--dim);margin-bottom:8px}
.f input[type=text],.f textarea,.f select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12px;font-family:inherit}
.f textarea{min-height:70px;resize:vertical}
.f input[type=range]{width:100%}
.f .seg2{display:flex;gap:6px;flex-wrap:wrap}
.f .seg2 button{all:unset;cursor:pointer;font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--line2);color:var(--mut)}
.f .seg2 button.on{border-color:var(--pb);background:var(--pbg);color:#dedeff}
.gauge{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--mut)}
.obj{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:default}
.obj .hd{display:flex;align-items:center;gap:8px}
.obj .nm{font-weight:500}
.obj .hh{font-size:10px;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace}
.obj .mt{font-size:11px;color:var(--mut);margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:400;font-size:10.5px}
td.num,th.num{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
tr:last-child td{border-bottom:0}
.curve{width:100%;height:150px;display:block}
.log{background:#0d0d0c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.75;color:#a8c9b8;max-height:220px;overflow:auto;white-space:pre-wrap}
pre.json{background:#0e0e0d;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:#bfe3d1;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}
details summary{cursor:pointer;color:var(--mut);font-size:11.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,160%);background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:12px;z-index:60;transition:transform .24s ease;max-width:76vw}
.toast.on{transform:translate(-50%,0)}
.toast b{color:var(--p)}
.bar{height:7px;background:var(--panel3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pb);transition:width .2s}
</style>
</head>
<body>
<div class="app">
<aside class="rail">
  <div class="brand"><div class="mark"></div><div><b>织造</b><span>单机流程 · demo</span></div></div>
  <div class="grp">单机（不需要网络）</div>
  <nav class="nav" id="nav">
    <button data-v="lib" class="on"><span class="n">1</span>我的模型</button>
    <button data-v="arch"><span class="n">2</span>定义架构</button>
    <button data-v="data"><span class="n">3</span>数据</button>
    <button data-v="train"><span class="n">4</span>开始训练</button>
    <button data-v="card"><span class="n">5</span>模型卡</button>
  </nav>
  <div class="foot">
    <div class="l1">这台设备</div>
    <div class="l2" id="devLine">探测中…</div>
    <div class="l1" style="margin-top:6px">引擎</div>
    <div class="l2" id="engLine">—</div>
  </div>
</aside>
<main class="main">
  <div class="topbar">
    <div><h1 id="ttl">我的模型</h1><div class="sub" id="sub">架构和权重分开管</div></div>
    <div class="spacer"></div>
    <span class="chip t">单机模式 · 数据不出本地</span>
    <a class="btn ghost sm" href="app.html">看协作流程 →</a>
  </div>
  <div class="scroll" id="scroll"></div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 工具（与仓库同构） ================= */
function fnv1a(str){let h=0x811c9dc5>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function fnv1aHex(s){return fnv1a(s).toString(16).padStart(8,'0');}
function sortKeys(o){if(Array.isArray(o))return o.map(sortKeys);if(o&&typeof o==='object'){const r={};Object.keys(o).sort().forEach(k=>r[k]=sortKeys(o[k]));return r;}return o;}
function hashOf(o){return fnv1aHex(JSON.stringify(sortKeys(o)));}
function fmtB(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function fmtN(n){ return n.toLocaleString('en-US'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ================= 状态 ================= */
const S={
  cap:null,
  archs:[],          // 架构库（Spec）
  weights:[],        // 权重库（checkpoints）
  dataset:null,      // 数据
  arch:{             // 当前正在编辑的架构
    name:'我的小模型', layers:4, dim:128, heads:4, ctx:96, vocab:65, seed:20261008,
    source:'模板'
  },
  run:null           // 训练运行
};

/* 参数量（decoder-only，FFN=4×dim，embedding 与输出共享） */
function archParams(a){ return a.vocab*a.dim + a.layers*(12*a.dim*a.dim + 2*a.dim); }
function archBytes(a){ return archParams(a)*4; }
function archKb(a){ return JSON.stringify({layers:a.layers,dim:a.dim,heads:a.heads,ctx:a.ctx,vocab:a.vocab}).length; }
function vramEst(a){ return archParams(a)*4*4; }   // 参数+梯度+优化器状态+激活的粗估

/* ================= 真实能力探测 ================= */
function detectKind(){const ua=navigator.userAgent;
  if(/Android/i.test(ua))return 'Android';if(/iPhone|iPad|iPod/i.test(ua))return 'iOS';
  if(/Mac OS X/i.test(ua))return 'macOS';if(/Windows/i.test(ua))return 'Windows';
  if(/Linux/i.test(ua))return 'Linux';return '未知设备';}
async function probe(){
  const c={kind:detectKind(),cores:navigator.hardwareConcurrency||0,memGB:navigator.deviceMemory||0,
    secure:!!window.isSecureContext,hasGpuApi:!!navigator.gpu,adapterOk:false,f16:false,note:''};
  if(c.hasGpuApi){ try{ const ad=await navigator.gpu.requestAdapter();
    if(ad){c.adapterOk=true;c.f16=ad.features.has('shader-f16');} }catch(e){c.note=String(e&&e.message||e);} }
  c.engine = (c.adapterOk&&c.f16) ? 'gpu-tinygpt（WebGPU，快）' : 'mlp（纯 JS，任何设备可跑）';
  c.why = (c.adapterOk&&c.f16) ? '这台设备能拿到 WebGPU 适配器且支持 f16，可以直接用 GPU 引擎。'
        : c.adapterOk ? '能拿到适配器但没有 f16，会用 fp32 跑，慢一些；也可以先用纯 JS 引擎。'
        : '这台设备没有可用的 WebGPU，单机训练会用纯 JS 引擎——慢但能跑完，且不依赖网络。';
  return c;
}

/* ================= 视图 ================= */
const T={lib:['我的模型','架构和权重分开管'],
  arch:['定义架构','三种方式：改模板 / 说人话让 AI 生成 / 从公地拿'],
  data:['数据','拖进来就行，数据不出这台机器'],
  train:['开始训练','单机训练，不需要任何网络'],
  card:['模型卡','一次训练的产物：架构 + 权重 + 数据 + 曲线']};
const AFTER={};

function render(){
  const v=(location.hash||'#/lib').replace('#/','')||'lib';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.getElementById('ttl').textContent=T[v][0];
  document.getElementById('sub').textContent=T[v][1];
  document.getElementById('scroll').innerHTML=VIEWS[v]();
  if(AFTER[v]) AFTER[v]();
  document.getElementById('scroll').scrollTop=0;
}

const VIEWS={};

/* ---------- 1 我的模型 ---------- */
VIEWS.lib=()=>{
  const c=S.cap||{};
  return `
  <div class="row c3">
    <div class="card"><div class="cap">架构（Spec）</div><div class="big">${S.archs.length}</div>
      <div class="cap">几 KB 一个 · 可分享 · AI 能写</div></div>
    <div class="card"><div class="cap">权重</div><div class="big">${S.weights.length}</div>
      <div class="cap">几十 MB 一个 · 跟架构绑定</div></div>
    <div class="card"><div class="cap">数据集</div><div class="big">${S.dataset?'1':'0'}</div>
      <div class="cap">原文不出这台机器</div></div>
  </div>

  <h2 class="sec">为什么要分成两半 —— 这是一次性的心智，看懂就够用</h2>
  <div class="card">
    <div class="row c2" style="gap:14px">
      <div>
        <div style="font-weight:500;margin-bottom:4px">架构 = 房子的图纸</div>
        <div class="note" style="margin-top:0">几层、每层多宽、上下文多长、词表多大。</div>
        <div class="kv"><span>大小</span><b>几 KB（就是一段文字）</b></div>
        <div class="kv"><span>谁写</span><b>你调旋钮，或让 AI 写</b></div>
        <div class="kv"><span>几个模型共用?</span><b>可以，图纸能复用</b></div>
      </div>
      <div>
        <div style="font-weight:500;margin-bottom:4px">权重 = 盖好的房子</div>
        <div class="note" style="margin-top:0">按图纸算出来的那一大堆数字，决定了房子的"性格"。</div>
        <div class="kv"><span>大小</span><b>几十 MB（比图纸大 1000 倍）</b></div>
        <div class="kv"><span>谁写</span><b>训练出来的，不是写出来的</b></div>
        <div class="kv"><span>能换图纸吗?</span><b><span style="color:var(--a)">不能，换了就作废</span></b></div>
      </div>
    </div>
    <div class="okbox" style="margin-top:10px">所以本 demo 把它们<b>分成两个库</b>：改图纸不影响别人；
      但一份权重永远记得自己是按哪张图纸算出来的。</div>
  </div>

  <h2 class="sec">架构库 <span class="cap">（图纸，可以随便复制和改）</span></h2>
  ${S.archs.length?S.archs.map(a=>`
    <div class="obj">
      <div class="hd"><span class="nm">${a.name}</span><span class="tag p">架构</span>
        <span class="hh">spec ${hashOf({l:a.layers,d:a.dim,h:a.heads,c:a.ctx,v:a.vocab})}</span>
        <div class="spacer" style="flex:1"></div><span class="tag">${a.source}</span></div>
      <div class="mt">${a.layers} 层 · 宽 ${a.dim} · ${a.heads} 头 · 上下文 ${a.ctx} · 词表 ${a.vocab}
        — 参数量 <b>${fmtN(archParams(a))}</b> · 大小 ${fmtB(archKb(a))} · 权重会占 ${fmtB(archBytes(a))}</div>
      <div class="actions" style="margin-top:8px">
        <button class="btn sm" data-train="${a.name}">用这张图纸开始训练</button>
        <button class="btn ghost sm" data-fork="${a.name}">复制一份改</button>
        <button class="btn ghost sm" data-del="${a.name}">删除</button>
      </div>
    </div>`).join(''):'<div class="card"><div class="cap">还没有架构。去「定义架构」建一个（或者让 AI 写一个）。</div></div>'}

  <h2 class="sec">权重库 <span class="cap">（训练产物，跟架构绑定）</span></h2>
  ${S.weights.length?S.weights.map(w=>{
     const stale=!S.archs.some(a=>hashOf({l:a.layers,d:a.dim,h:a.heads,c:a.ctx,v:a.vocab})===w.specHash);
     return `<div class="obj">
      <div class="hd"><span class="nm">${w.name}</span><span class="tag b">权重</span>
        <span class="hh">spec ${w.specHash}</span>
        <div class="spacer" style="flex:1"></div>
        ${stale?'<span class="tag r">图纸已不存在</span>':'<span class="tag t">可用</span>'}</div>
      <div class="mt">来自 ${w.steps} 步训练 · loss ${w.loss.toFixed(3)} · 大小 ${fmtB(w.bytes)} · ${w.at}</div>
      ${stale?'<div class="badbox" style="margin-top:8px">它依赖的那张图纸被删掉了 —— 权重单独存在没有意义，因为没人知道怎么用它。</div>':''}
      <div class="actions" style="margin-top:8px">
        <button class="btn sm" data-cont="${w.name}">继续训练</button>
        <button class="btn ghost sm" data-export="1">导出（.bin）</button>
        <button class="btn ghost sm" data-card="${w.name}">看模型卡</button>
      </div>
    </div>`;}).join(''):'<div class="card"><div class="cap">还没有权重。走完「定义架构 → 数据 → 开始训练」就会有一个。</div></div>'}

  <div class="anchor">技术锚点：<b>design/01 铁律 1「模型是数据不是代码」</b>；
    <b>11 §3.1 ModelArtifact = {specHash, params, provenance, parents, adapters}</b>；
    架构进 <b>Spec IR（03）</b>，权重是内容寻址的 blob。</div>`;
};
AFTER.lib=()=>{
  document.querySelectorAll('[data-train]').forEach(b=>b.addEventListener('click',e=>{
    const a=S.archs.find(x=>x.name===b.dataset.train); if(a){S.arch={...a};} go('data'); }));
  document.querySelectorAll('[data-fork]').forEach(b=>b.addEventListener('click',e=>{
    const a=S.archs.find(x=>x.name===b.dataset.fork);
    if(a){ S.arch={...a,name:a.name+' 副本',source:'复制'}; go('arch'); }}));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    S.archs=S.archs.filter(x=>x.name!==b.dataset.del); toast('架构已删除。依赖它的权重会显示"图纸已不存在"。'); render(); }));
  document.querySelectorAll('[data-export]').forEach(b=>b.addEventListener('click',()=>toast('导出的是一个几十 MB 的二进制文件，用任何实现都能加载。')));
  document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>go('card')));
  document.querySelectorAll('[data-cont]').forEach(b=>b.addEventListener('click',()=>go('data')));
};

/* ---------- 2 定义架构 ---------- */
let ATAB='tmpl', GEN=null;
VIEWS.arch=()=>{
  const a=S.arch, p=archParams(a);
  return `
  <div class="tabs">
    <button data-at="tmpl" class="${ATAB==='tmpl'?'on':''}">从模板改（我就调 4 个旋钮）</button>
    <button data-at="ai" class="${ATAB==='ai'?'on':''}">说人话，让 AI 写</button>

AFTER.arch=()=>{
  document.querySelectorAll('[data-at]').forEach(b=>b.addEventListener('click',()=>{ATAB=b.dataset.at;render();}));
  const bind=(id,key,fn)=>{const e=document.getElementById(id);if(!e)return;
    e.addEventListener('input',()=>{S.arch[key]=fn(e.value);const s=document.getElementById('v_'+key);if(s)s.textContent=S.arch[key];render();});};
  bind('a_layers','layers',v=>+v); bind('a_dim','dim',v=>+v); bind('a_ctx','ctx',v=>+v);
  bind('a_heads','heads',v=>+v);
  const nm=document.getElementById('a_name'); if(nm) nm.addEventListener('input',()=>S.arch.name=nm.value);
  const sv=document.getElementById('a_save'); if(sv) sv.addEventListener('click',()=>{
    const a={...S.arch}; a.heads=(a.dim%a.heads===0)?a.heads:(a.dim>=8?8:1);
    S.archs=S.archs.filter(x=>x.name!==a.name).concat([a]);
    toast('已保存架构 <b>'+a.name+'</b>（'+fmtB(archKb(a))+'，权重会占 '+fmtB(archBytes(a))+'）。'); go('data');});
  const pf=document.querySelector('[data-pf]'); if(pf) pf.addEventListener('click',()=>{
    const ta=document.getElementById('g_prompt');
    const ex=['做一个很小的模型，我想在这台旧笔记本上从头训，能续写英文短句就行。',
              '帮我配一个 6 层、宽 256 的模型，上下文 256，用来做中文问答。',
              '预算很紧，越小越好，先跑通流程看看效果。'];
    ta.value=ex[Math.floor(Math.random()*ex.length)];});
  const gr=document.getElementById('g_run'); if(gr) gr.addEventListener('click',()=>{
    const q=document.getElementById('g_prompt').value;
    // 一个"看起来像真的"的解析：从描述里抽关键词，映射到合理结构
    const big=/大|6\s*层|256/.test(q), mid=/中|4\s*层|192|两三百万|300/.test(q);
    const layers=big?6:(mid?4:3), dim=big?256:(mid?192:128);
    GEN={name:'AI 生成的架构',layers,dim,heads:big?8:(mid?6:4),ctx:big?256:128,vocab:65,
      why:`按你的要求（${q.slice(0,18)}…）选了 ${layers} 层 × 宽 ${dim}：参数量落在你描述的区间内，且这台设备单机能训完。`,
      trace:`register.query("${q.slice(0,14)}…", budget=这台设备)
  → 命中 12 个相关 op schema（词汇表被裁剪过）

llm.generate(schema, prompt)
  → 受限解码，输出只能是合法结构（语法错误率趋零）

ir.infer(IR)          [毫秒级 · 不跑 GPU]
  → 无 error；1 条 warn：vocab 待由数据确定

ir.plan(IR, cluster=[本机])
  → 策略=backprop · 精度=fp32 · 预估峰值内存 ${fmtB(vramEst({layers,dim,vocab:65}))}
  → 在预算内 ✓`};
    render(); toast('AI 写好了。往下看它的<b>选择理由</b>和<b>代价</b>。');});
  const ga=document.getElementById('g_accept'); if(ga) ga.addEventListener('click',()=>{
    S.arch={...S.arch,...GEN,name:'AI 生成的架构',source:'AI 生成'}; S.archs=S.archs.filter(x=>x.name!=='AI 生成的架构').concat([{...S.arch}]);
    toast('已保存。接下来加数据 —— <b>词表大小由数据决定</b>。'); go('data');});
  const ge=document.getElementById('g_edit'); if(ge) ge.addEventListener('click',()=>{
    S.arch={...S.arch,...GEN,name:'AI 生成的架构（手改中）',source:'AI 生成'}; ATAB='tmpl'; render();});
  document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{
    const presets={'tiny-shakespeare-lm':{layers:2,dim:128,heads:4,ctx:96},
                   'zh-mini-3m':{layers:4,dim:192,heads:4,ctx:128},
                   'code-mini':{layers:6,dim:256,heads:8,ctx:256}};
    const p=presets[b.dataset.pick];
    S.arch={name:b.dataset.pick,...p,vocab:65,seed:20261008,source:'公地'};
    S.archs=S.archs.filter(x=>x.name!==S.arch.name).concat([{...S.arch}]);
    toast('已拿到图纸 <b>'+S.arch.name+'</b>。'); render();}));
};

/* ---------- 3 数据 ---------- */

function vocabOf(text){ return [...new Set(text)].sort(); }
VIEWS.data=()=>{

          <div class="note" style="margin-top:5px">这 ${d.vocab.length} 个字符就是模型的"字母表"。它会自动写进架构，

      </div>
      <div class="actions" style="margin-top:12px">

      <div class="card"><div class="cap">左边放一段文字，或者点"用内置的 Tiny Shakespeare"。</div>
        <div class="note">放进来之后你会看到：词表、数据指纹、探针窗口 —— 这三个就是后面训练要用的全部。</div></div>`}
    </div>
  </div>
  <div class="anchor">技术锚点：<b>src/fed/corpus.ts</b>（vocabOf = [...new Set(text)].sort()；
    pickProbe 取中段；corpusDigest）；<b>design/11 §2.1 原始数据不出本地</b>、<b>§2.2 数据集登记</b>。</div>`;

AFTER.data=()=>{
  const use=(text,name)=>{
    if(!text||text.length<32){ toast('太短了，多给一点（至少几十个字），否则词表没意义。'); return; }
    const v=vocabOf(text);
    S.dataset={name,text,chars:text.length,vocab:v,hash:fnv1aHex(name+'|'+text.length+'|'+text.slice(0,64)+'|'+v.length),
      probe:Math.min(1024,Math.max(16,Math.floor(text.length*0.2)))};
    // 词表变了 ⇒ 架构的 vocab 跟着变（真实的硬约束）
    S.arch.vocab=v.length;
    toast('数据已登记：<b>'+v.length+'</b> 个词表字符，指纹 <span class="mono">'+S.dataset.hash+'</span>。架构的 vocab 已自动改成 '+v.length+'。');
    render();
  };
  const b=document.getElementById('d_use'); if(b) b.addEventListener('click',()=>use(document.getElementById('d_text').value,'我粘贴的文本'));
  const bi=document.getElementById('d_builtin'); if(bi) bi.addEventListener('click',()=>{
    // 内置语料的替身：用一段可复现的伪莎士比亚文本
    let s=''; const words=['the','king','love','death','night','time','heart','man','life','honour','thou','shall','never','again','sweet','fair','eyes','soul','blood','crown'];
    const seed=1234567; let x=seed;
    for(let i=0;i<4000;i++){ x=(x*1103515245+12345)&0x7fffffff; s+=words[x%words.length]+((x%9===0)?'.\n':' '); }
    use(s,BUILTIN.replace('（内置，1,115,394 字）','（内置替身）')); });
  const n=document.getElementById('d_next'); if(n) n.addEventListener('click',()=>go('train'));
};

/* ---------- 4 开始训练 ---------- */

  const totalSteps = r?r.total:0;
  return `

  <h2 class="sec">日志</h2>
  <div class="log" id="runlog">${r.log.join('\n')}</div>
  ${r.done?`<div class="actions" style="margin-top:14px"><button class="btn" id="toCard">训练完成，看模型卡 →</button></div>`:''}
  `:''}

  <div class="anchor">技术锚点：<b>src/train/trainer.ts</b>（循环+AdamW）、<b>src/infer/sampler.ts</b>；
    <b>design/06 执行引擎</b>（编译四阶段 infer→plan→emit→run）、<b>07 学习策略层</b>
    （反传只是 Strategy 的一个实现，所以上面能换学习方法）。</div>`;
};
AFTER.train=()=>{
  ['t_steps','t_batch','t_lr'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('input',render);});
  const rb=document.getElementById('runBtn'); if(rb) rb.addEventListener('click',startRun);
  const sb=document.getElementById('stopBtn'); if(sb) sb.addEventListener('click',()=>{ if(S.run){S.run.running=false;S.run.log.push('用户停止。已训 '+S.run.step+' 步，权重已保存。'); if(S.run.step>0) saveWeight(); render();}});
  const tc=document.getElementById('toCard'); if(tc) tc.addEventListener('click',()=>go('card'));
  if(S.run&&S.run.running) tick();
};
let timer=null;
function startRun(){
  if(!S.dataset){toast('先加数据。');return;}
  const a=S.arch;
  const total=+document.getElementById('t_steps').value;
  const batch=+document.getElementById('t_batch').value;
  const lr=+(document.getElementById('t_lr').value*0.0001);
  const L0=Math.log(a.vocab), Lend=Math.max(1.2,L0*0.66);
  S.run={running:true,done:false,step:0,total,batch,lr,loss:L0,probe:L0,L0,Lend,tau:total/3.2,pts:[],
    log:['engine='+(S.cap&&S.cap.adapterOk?'gpu-tinygpt':'mlp')+' · strategy=backprop · fp32',
         'params='+fmtN(archParams(a))+' · bytes='+fmtB(archBytes(a)),
         'dataset='+S.dataset.name+' chars='+fmtN(S.dataset.chars)+' vocab='+S.dataset.vocab.length,
         'probe=hold-out '+S.dataset.probe+' 字（永不参与训练）',
         'train …']};
  toast('开始训练。初始 loss 约 <b>'+L0.toFixed(3)+'</b>（= ln 词表大小，未训练模型的期望值）。');
  render(); tick();
}
function tick(){
  clearTimeout(timer);
  const r=S.run; if(!r||!r.running) return;
  const per=Math.max(1,Math.round(r.total/60));
  r.step=Math.min(r.total,r.step+per);
  const x=r.step/r.total;
  r.loss=r.Lend+(r.L0-r.Lend)*Math.exp(-3.2*x)+ (Math.random()-0.5)*0.02;
  r.probe=r.Lend+0.18+(r.L0-r.Lend)*Math.exp(-3.0*x)+(Math.random()-0.5)*0.03;
  r.pts.push([r.step,r.loss]);
  if(r.step%Math.max(1,Math.round(r.total/8))===0||r.step===r.total)
    r.log.push('step '+String(r.step).padStart(4)+'  loss '+r.loss.toFixed(4)+'  probe '+r.probe.toFixed(4));
  const line=document.getElementById('curveLine');
  if(line){
    const pts=r.pts.map(p=>`${(p[0]/r.total*620).toFixed(1)},${(140-((p[1]-1.0)/3.4)*132).toFixed(1)}`).join(' ');
    line.setAttribute('points',pts);
  }
  const lg=document.getElementById('runlog'); if(lg){lg.textContent=r.log.join('\n');lg.scrollTop=lg.scrollHeight;}
  const bar=document.querySelector('.bar i'); if(bar) bar.style.width=(r.step/r.total*100)+'%';
  if(r.step>=r.total){ r.running=false; r.done=true; r.log.push('完成。探针 loss '+r.probe.toFixed(3)+'（初始 '+r.L0.toFixed(3)+'）');
    saveWeight(); render(); toast('训练完成。权重已存进权重库。'); return; }
  timer=setTimeout(tick,60);
}
function saveWeight(){
  const a=S.arch,r=S.run;
  const w={name:(S.dataset?S.dataset.name.split('（')[0]:'模型')+' · '+r.step+'步',
    specHash:hashOf({l:a.layers,d:a.dim,h:a.heads,c:a.ctx,v:a.vocab}),
    steps:r.step,loss:r.probe,bytes:archBytes(a),at:'刚刚'};
  S.weights=S.weights.filter(x=>x.name!==w.name).concat([w]);
}

/* ---------- 5 模型卡 ---------- */
VIEWS.card=()=>{
  const a=S.arch,d=S.dataset,w=S.weights[S.weights.length-1],r=S.run;
  if(!w) return `<div class="card"><div class="cap">还没有训练好的权重。先去「开始训练」跑一次。</div>
    <div class="actions" style="margin-top:10px"><button class="btn ghost" data-go="train">去训练</button></div></div>`;
  return `
  <h2 class="sec">模型卡（自动生成的）</h2>
  <div class="card">
    <div class="kv"><span>名称</span><b>${w.name}</b></div>
    <div class="kv"><span>架构</span><b>${a.layers} 层 · 宽 ${a.dim} · ${a.heads} 头 · ctx ${a.ctx} · 词表 ${a.vocab}</b></div>
    <div class="kv"><span>架构指纹 specHash</span><b class="mono">${w.specHash}</b></div>
    <div class="kv"><span>数据</span><b>${d?d.name+' · '+fmtN(d.chars)+' 字':'-'}</b></div>
    <div class="kv"><span>数据指纹</span><b class="mono">${d?d.hash:'-'}</b></div>
    <div class="kv"><span>训练步数</span><b>${w.steps} 步 · 批 ${r?r.batch:'-'} · lr ${r?r.lr:'-'}</b></div>
    <div class="kv"><span>探针 loss</span><b>${w.loss.toFixed(3)}（初始 ${Math.log(a.vocab).toFixed(3)}）</b></div>
    <div class="kv"><span>权重大小</span><b>${fmtB(w.bytes)}</b></div>
  </div>

  <h2 class="sec">能做什么（诚实版）</h2>
  <div class="card">
    <div class="okbox">能续写和它训练数据风格相近的短句；完全在你自己的机器上跑，不需要联网。</div>
    <div class="warnbox" style="margin-top:8px">它<b>很小</b>：说不了人话、答不了问题、也不懂逻辑。
      它的价值是"证明流程跑通了"+"你手里有一个真正属于自己的模型"。</div>
  </div>

  <h2 class="sec">导出</h2>
  <div class="card">
    <div class="row c2">
      <div><div class="cap">架构（几 KB）</div>
        <div class="kv"><span>内容</span><b>层数/宽度/头数/上下文/词表</b></div>
        <div class="actions" style="margin-top:8px"><button class="btn ghost sm" data-t="架构以纯文本导出，可以直接发给别人、也能被任何实现读。" >导出架构</button></div></div>
      <div><div class="cap">权重（几十 MB）</div>
        <div class="kv"><span>内容</span><b>参数 + 它依赖的 specHash</b></div>
        <div class="actions" style="margin-top:8px"><button class="btn ghost sm" data-t="权重以二进制导出，文件里带着 specHash，别人拿到就知道该配哪张架构。">导出权重</button></div></div>
    </div>
    <div class="note">两个分开导出是故意的：架构可以随便传（几 KB），权重是大文件、且<b>离开架构就没法用</b>。</div>
  </div>

  <h2 class="sec">下一步</h2>
  <div class="card">
    <div class="kv"><span>继续训练</span><b>接着这个权重再训，不用从头</b></div>
    <div class="kv"><span>用这个权重当起点做别的事</span><b>属于协作流程</b></div>
    <div class="actions" style="margin-top:10px">
      <button class="btn sm" data-go="train">继续训练</button>
      <a class="btn ghost sm" href="app.html">去协作流程 →</a>
    </div>
  </div>
  <div class="anchor">技术锚点：<b>design/14 §2.3 Snapshot</b>（只有参数不算合法快照，要带数据进度）、
    <b>11 §3.4 模型卡</b>、<b>16 SPEC-1 对象模型</b>。</div>`;
};

/* ---------- 通用 ---------- */
let tt; function toast(h){const t=document.getElementById('toast');t.innerHTML=h;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3600);}
function go(v){location.hash='#/'+v;}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v);});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);
  const t=e.target.closest('[data-t]');if(t)toast(t.dataset.t);});
window.addEventListener('hashchange',render);

(async()=>{ render(); S.cap=await probe();
  const dl=document.getElementById('devLine'), el=document.getElementById('engLine');
  if(dl) dl.textContent=S.cap.kind+' · '+(S.cap.cores||'?')+' 核'+(S.cap.memGB?' · '+S.cap.memGB+'GB':'');
  if(el) el.textContent=S.cap.adapterOk?(S.cap.f16?'WebGPU + f16':'WebGPU（无 f16）'):'纯 JS';
  if((location.hash||'').replace('#/','')==='train'||(location.hash||'')==='') render();
})();
</script>
