<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>织造 · 完整工作流 demo</title>
<style>
:root{
  --bg:#121211;--panel:#1a1a18;--panel2:#222220;--panel3:#2a2a27;
  --line:#33332e;--line2:#43433c;
  --txt:#ececea;--mut:#9f9f98;--dim:#6d6d66;
  --p:#afa9ec;--pbg:#2a2750;--pb:#7f77dd;
  --t:#5dcaa5;--tbg:#0f3329;--tb:#1e6b53;
  --b:#85b7eb;--bbg:#10304c;--bb:#245b8a;
  --a:#ef9f27;--abg:#3a2a0c;--ab:#7a5514;
  --r:#e24b4a;--rbg:#3a1616;--rb:#7a2b2b;
  --g:#97c459;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.app{display:grid;grid-template-columns:212px 1fr;height:100vh;overflow:hidden}

/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;padding:14px 11px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 7px 12px}
.brand .mark{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#7f77dd,#5dcaa5);flex:0 0 auto}
.brand b{font-size:13.5px;font-weight:500}
.brand span{display:block;font-size:10.5px;color:var(--dim);margin-top:-2px}
.grp{font-size:10px;color:var(--dim);letter-spacing:.8px;padding:12px 8px 5px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{all:unset;cursor:pointer;padding:6px 9px;border-radius:8px;color:var(--mut);display:flex;align-items:center;gap:8px;font-size:12.5px}
.nav button:hover{background:var(--panel2);color:var(--txt)}
.nav button.on{background:var(--pbg);color:#e6e3ff}
.nav .n{width:15px;height:15px;border-radius:50%;background:var(--panel3);color:var(--dim);font-size:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.nav button.on .n{background:var(--pb);color:#14140f}
.rail .foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line)}
.rail .foot .l1{font-size:10px;color:var(--dim)}
.rail .foot .l2{font-size:11.5px;color:var(--mut);margin-top:2px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.topbar h1{font-size:14.5px;font-weight:500;margin:0}
.topbar .sub{font-size:10.5px;color:var(--dim)}
.spacer{flex:1}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.chip.l0{background:var(--pbg);border-color:#4a4582;color:#cfcaff}
.chip.l1{background:var(--tbg);border-color:var(--tb);color:#a7efd4}
.chip.l2{background:var(--abg);border-color:var(--ab);color:#f6cf8c}
.chip.l3{background:var(--rbg);border-color:var(--rb);color:#f3aeae}
.chip.g{background:var(--tbg);border-color:var(--tb);color:#a7efd4}
.chip.r{background:var(--rbg);border-color:var(--rb);color:#f3aeae}
button.btn{all:unset;cursor:pointer;font-size:12px;padding:6px 12px;border-radius:8px;background:var(--pbg);color:#ded9ff;border:1px solid #4a4582;white-space:nowrap}
button.btn:hover{background:#34306a}
button.btn.ghost{background:transparent;color:var(--mut);border-color:var(--line2)}
button.btn.ghost:hover{color:var(--txt);background:var(--panel2)}
button.btn.sm{font-size:11px;padding:4px 9px}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.scroll{overflow:auto;padding:18px;flex:1 1 auto}
.view{display:none}.view.on{display:block}
h2.sec{font-size:11.5px;font-weight:500;color:var(--dim);letter-spacing:.6px;margin:0 0 10px}
h2.sec:not(:first-child){margin-top:22px}
.note{font-size:11px;color:var(--dim);margin-top:8px}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.row.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
.card.pad0{padding:0;overflow:hidden}
.card .big{font-size:21px;font-weight:500;letter-spacing:.4px}
.card .cap{font-size:10.5px;color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;color:var(--mut)}
.kv b{color:var(--txt);font-weight:400;text-align:right}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.tag.p{background:var(--pbg);color:#cfcaff;border-color:#4a4582}
.tag.t{background:var(--tbg);color:#a7efd4;border-color:var(--tb)}
.tag.b{background:var(--bbg);color:#bfdcf7;border-color:var(--bb)}
.tag.a{background:var(--abg);color:#f6cf8c;border-color:var(--ab)}
.tag.r{background:var(--rbg);color:#f3aeae;border-color:var(--rb)}
.anchor{margin-top:22px;font-size:10.5px;color:var(--dim);border-top:1px dashed var(--line2);padding-top:9px}
.anchor b{color:var(--p);font-weight:400}
.actions{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:400;font-size:10.5px}
td.num,th.num{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
tr:last-child td{border-bottom:0}
.led{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.led.on{background:var(--t)}.led.idle{background:var(--dim)}.led.warn{background:var(--a)}.led.off{background:var(--r)}

/* pick cards */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s}
.pick:hover{border-color:var(--pb)}
.pick .t{font-size:14px;font-weight:500;margin-bottom:5px}
.pick .s{font-size:11.5px;color:var(--mut);min-height:38px}
.pick .go{font-size:11.5px;color:var(--p);margin-top:8px}

/* phase */
.phases{display:flex;flex-wrap:wrap;gap:6px;row-gap:10px}
.ph{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.ph .n{width:15px;height:15px;border-radius:50%;background:var(--panel3);color:var(--dim);font-size:9px;display:flex;align-items:center;justify-content:center}
.ph .lb{font-size:11px;color:var(--mut)}
.ph.done{border-color:var(--tb)}.ph.done .n{background:var(--tbg);color:#a7efd4}
.ph.now{border-color:var(--pb);background:var(--pbg)}.ph.now .lb{color:#dedeff}.ph.now .n{background:var(--pb);color:#14140f}

/* wizard */
.wz{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
.wsteps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.wstep{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.wstep.on{border-color:var(--pb);background:var(--pbg);color:#dedeff}
.wstep.done{border-color:var(--tb);color:#a7efd4}
.frm{display:flex;flex-direction:column;gap:12px}
.f{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.f .lb{font-size:12px;font-weight:500;margin-bottom:2px}
.f .hint{font-size:10.5px;color:var(--dim);margin-bottom:8px}
.f select,.f input[type=text],.f input[type=number]{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:7px;padding:5px 7px;font-size:11.5px}
.f input[type=range]{width:100%}
.f .seg2{display:flex;gap:6px;flex-wrap:wrap}
.f .seg2 button{all:unset;cursor:pointer;font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid var(--line2);color:var(--mut)}
.f .seg2 button.on{border-color:var(--pb);background:var(--pbg);color:#dedeff}
.side{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.fp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:var(--p);letter-spacing:.5px;word-break:break-all}
pre.mani{background:#0e0e0d;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.6;color:#bfe3d1;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.warnbox{background:var(--abg);border:1px solid var(--ab);border-radius:9px;padding:9px 11px;font-size:11px;color:#f6cf8c}
.okbox{background:var(--tbg);border:1px solid var(--tb);border-radius:9px;padding:9px 11px;font-size:11px;color:#a7efd4}
.badbox{background:var(--rbg);border:1px solid var(--rb);border-radius:9px;padding:9px 11px;font-size:11px;color:#f3aeae}

/* log */
.log{background:#0d0d0c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;line-height:1.75;color:#a8c9b8;max-height:280px;overflow:auto;white-space:pre-wrap}
.log .e{color:#f0997b}.log .w{color:#ef9f27}.log .k{color:#85b7eb}.log .g{color:#5dcaa5}

/* tree */
.gwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:auto}
svg.tree{width:100%;height:auto;display:block;min-width:780px}
.tn{cursor:pointer}.tn rect{transition:stroke .12s}.tn:hover rect{stroke:var(--p)}
.tn.sel rect{stroke:#e0dcff;stroke-width:1.6}
.tn text{font-size:11px;fill:var(--txt)}.tn .sub{font-size:9.5px;fill:var(--dim)}
.te{stroke:var(--line2);stroke-width:1;fill:none}
.te.fork{stroke-dasharray:5 4}.te.p{stroke:#7f77dd;stroke-width:1.6}
.tel{font-size:9.5px;fill:var(--dim)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:18px;border-top:1px solid var(--line2);vertical-align:4px;margin-right:5px}
.legend i.d{border-top-style:dashed}.legend i.p{border-top:1.6px solid var(--pb)}

/* gap table */
.gap{font-size:11.5px}
.gap td{white-space:normal;vertical-align:top}
.st{font-size:10px;padding:1px 7px;border-radius:5px;white-space:nowrap}
.st.ok{background:var(--tbg);color:#a7efd4}
.st.part{background:var(--abg);color:#f6cf8c}
.st.no{background:var(--rbg);color:#f3aeae}

.novonly{display:block}.proonly{display:none}
body.pro .novonly{display:none}body.pro .proonly{display:block}

/* phone frame for join view */
.phone{width:310px;margin:0 auto;border:1px solid var(--line2);border-radius:26px;padding:14px;background:var(--panel)}
.phone .notch{width:70px;height:5px;border-radius:3px;background:var(--panel3);margin:0 auto 12px}
.phone .scr{background:var(--bg);border-radius:16px;padding:14px;min-height:420px;display:flex;flex-direction:column;gap:10px}
.bigbtn{display:block;width:100%;text-align:center;padding:12px;border-radius:12px;background:var(--pbg);border:1px solid #4a4582;color:#dedeff;font-size:14px;cursor:pointer}
.bigbtn.q{background:transparent;border-color:var(--line2);color:var(--mut);font-size:12.5px;padding:10px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,160%);background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:12px;z-index:60;transition:transform .24s ease;max-width:76vw}
.toast.on{transform:translate(-50%,0)}
.toast b{color:var(--p)}
</style>
</head>
<body class="novice">
<div class="app">

<aside class="rail">
  <div class="brand"><div class="mark"></div><div><b>织造</b><span>完整工作流 demo</span></div></div>

  <div class="grp">准备</div>
  <nav class="nav" id="nav1">
    <button data-v="start" class="on"><span class="n">1</span>入口</button>
    <button data-v="probe"><span class="n">2</span>能力探测</button>
    <button data-v="base"><span class="n">3</span>选起点</button>
  </nav>

  <div class="grp">建房间</div>
  <nav class="nav" id="nav2">
    <button data-v="create"><span class="n">4</span>创建向导</button>
  </nav>

  <div class="grp">协作</div>
  <nav class="nav" id="nav3">
    <button data-v="room"><span class="n">5</span>房间总览</button>
    <button data-v="join"><span class="n">6</span>别人加入</button>
    <button data-v="train"><span class="n">7</span>训练进行中</button>
  </nav>

  <div class="grp">收尾</div>
  <nav class="nav" id="nav4">
    <button data-v="verify"><span class="n">8</span>验收</button>
    <button data-v="publish"><span class="n">9</span>发布</button>
    <button data-v="audit"><span class="n">10</span>血缘与账本</button>
  </nav>

  <div class="grp">核对</div>
  <nav class="nav" id="nav5">
    <button data-v="gap"><span class="n">11</span>设计↔代码</button>
  </nav>

  <div class="foot">
    <div class="l1">身份</div>
    <div class="l2" id="whoami">@我 · 房主</div>
    <div class="l1" style="margin-top:6px">模式</div>
    <div class="l2" id="modeName">小白 · 照房主设置</div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div><h1 id="ttl">入口</h1><div class="sub" id="sub">选择你要做什么</div></div>
    <div class="spacer"></div>
    <span id="ctx" class="chip">没有房间</span>
    <div class="seg2" style="display:flex;gap:0;border:1px solid var(--line2);border-radius:9px;overflow:hidden">
      <button class="btn ghost sm" id="mNov" style="border:0;border-radius:0">小白</button>
      <button class="btn ghost sm" id="mPro" style="border:0;border-radius:0">专业</button>
    </div>
  </div>
  <div class="scroll" id="scroll"></div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   0. 基础工具：与仓库 src/fed/protocol.ts 同构
   ============================================================ */
function fnv1a(str){
  let h=0x811c9dc5>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h>>>0;
}
function fnv1aHex(s){ return fnv1a(s).toString(16).padStart(8,'0'); }
function sortKeys(o){
  if(Array.isArray(o)) return o.map(sortKeys);
  if(o&&typeof o==='object'){ const r={}; Object.keys(o).sort().forEach(k=>r[k]=sortKeys(o[k])); return r; }
  return o;
}
function fingerprintOf(o){ return fnv1aHex(JSON.stringify(sortKeys(o))); }
const MAGIC='0x574c4644';                 // 'WLFD'
const HEADER_OVERHEAD=216;                // 13,521 参数 -> 54,300 字节 ⟹ 载荷 54,084 + 头 216

/* ============================================================
   1. 全局状态（对应 RoomManifest）
   ============================================================ */
const S={
  cap:null,
  base:'zh-lora-v2@0.71',
  mode:'novice',
  created:false,
  round:1,
  // 向导配置 —— 字段名与 RoomManifest / ModelSpec 对齐
  cfg:{
    roomId:'room-42', taskName:'闽南语医疗方言', taskBrief:'把公共 check 微调到医疗问句上',
    visibility:'L2',
    engine:'mlp', preset:'small',
    vocabSize:65, ctx:64, embDim:48, hidden:128, seed:20261006,
    blockSize:64, nLayer:4, nHead:4, nEmbd:128, bias:false, maxBatch:8,
    shards:3, shardMode:'interleave',
    corpusName:'Tiny Shakespeare（任务提供）', corpusChars:1115394,
    probeSize:1024, probeEvalCount:256, verifyTol:1e-3, crossCheck:false,
    rounds:20, localSteps:10, batchSize:8, lr:0.0003,
    aggMode:'fedavg', outerLr:1, momentum:0.9,
    policy:'auto'
  }
};

/* 参数量：小档取仓库真实值 13,521（demo MLP） */
const PARAMS={ small:{mlp:13521,gpu:108000}, medium:{mlp:131072,gpu:430000}, large:{mlp:1245184,gpu:1720000} };
function params(){
  const m=S.cfg.engine==='mlp'?'mlp':'gpu';
  return PARAMS[S.cfg.preset][m];
}
function frameBytes(p){ return p*4+HEADER_OVERHEAD; }         // 全量 fp32 权重帧
function loraBytes(p){ return Math.round(p*0.035*4); }         // LoRA 增量 ≈ 3.5% 参数
function sparseBytes(p){ return Math.round(p*0.03*0.25)+64; }   // top-3% + 2bit
function secs(bytes,mbps){ return bytes*8/(mbps*1e6); }

/* ============================================================
   2. 能力探测（真实运行，对应 src/fed/capability.ts）
   ============================================================ */
function detectKind(){
  const ua=navigator.userAgent;
  if(/Android/i.test(ua)) return 'Android';
  if(/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
  if(/Mac OS X/i.test(ua)) return 'macOS';
  if(/Windows/i.test(ua)) return 'Windows';
  if(/Linux/i.test(ua)) return 'Linux';
  return '未知设备';
}
async function probe(){
  const c={
    kind:detectKind(),
    cores:(navigator.hardwareConcurrency||0),
    memGB:(navigator.deviceMemory||0),
    secure:!!window.isSecureContext,
    hasGpuApi:!!navigator.gpu,
    adapterOk:false,vendor:'',arch:'',device:'',f16:false,maxBuf:0,
    note:''
  };
  if(c.hasGpuApi){
    try{
      const ad=await navigator.gpu.requestAdapter();
      if(ad){
        c.adapterOk=true;
        const info=ad.info||{};
        c.vendor=info.vendor||''; c.arch=info.architecture||''; c.device=info.device||'';
        c.f16=ad.features.has('shader-f16');
        c.maxBuf=(ad.limits&&ad.limits.maxBufferSize)||0;
      }
    }catch(e){ c.note=String(e&&e.message||e); }
  }
  // 与 capability.ts 的 advise 同构：三档建议
  if(!c.secure&&!c.hasGpuApi) c.advise='非安全上下文且无 WebGPU API：用 https 起服务（npm run demo --https），或 chrome://flags 打开 WebGPU。';
  else if(c.hasGpuApi&&!c.adapterOk) c.advise='有 WebGPU API 但拿不到适配器：常见于驱动过旧 / 远程桌面 / 虚拟 GPU。';
  else if(c.adapterOk&&!c.f16) c.advise='能拿到适配器但无 shader-f16：只能跑 fp32，会明显更慢。';
  else if(c.adapterOk&&c.f16) c.advise='WebGPU 就绪且支持 f16：可以当反传训练节点。';
  else c.advise='没有 WebGPU：仍可作为「评估节点」或「观察者（游客）」参与——这不是被排除，是换角色。';
  // 可担任角色（降级阶梯的真实落点）
  c.roles=[];
  if(c.adapterOk&&c.f16) c.roles.push(['训练节点','反传 / LoRA','t']);
  else if(c.adapterOk) c.roles.push(['训练节点','反传（fp32，较慢）','a']);
  c.roles.push(['评估节点','只做前向与探针评估','t']);
  c.roles.push(['观察者（游客）','只看曲线/账本/血缘','b']);
  if(c.secure) c.roles.push(['存储节点','为公地资产 pin','b']);
  return c;
}

/* ============================================================
   3. manifest 构造（字段与 src/fed/protocol.ts 的 RoomManifest 对齐）
   ============================================================ */
function manifest(){
  const c=S.cfg;
  const model = c.engine==='mlp'
    ? { engine:'mlp', preset:c.preset, vocabSize:c.vocabSize, ctx:c.ctx, embDim:c.embDim, hidden:c.hidden, seed:c.seed }
    : { engine:'gpu-tinygpt', preset:c.preset, vocabSize:c.vocabSize, blockSize:c.blockSize, nLayer:c.nLayer, nHead:c.nHead, nEmbd:c.nEmbd, bias:c.bias, maxBatch:c.maxBatch, seed:c.seed };
  const base={
    roomId:c.roomId, taskName:c.taskName, taskBrief:c.taskBrief,
    visibility:c.visibility,
    model,
    engineReason: c.policy==='cpu' ? '本地策略=cpu → 强制 mlp' : 'auto：开训时按全网复核，任一节点无 GPU 即全体降 mlp',
    rounds:c.rounds, localSteps:c.localSteps, batchSize:c.batchSize, lr:c.lr, shards:c.shards,
    shardMode:c.shardMode,
    corpus:{ name:c.corpusName, chars:c.corpusChars, vocabSize:c.vocabSize,
             digest:fnv1aHex(c.corpusName+'|'+c.corpusChars+'|'+'前4096字'+'|vocab'+c.vocabSize) },
    probe:{ size:c.probeSize, evalCount:c.probeEvalCount, tol:c.verifyTol },
    crossCheck:c.crossCheck,
    aggregate:{ mode:c.aggMode, outerLr:c.outerLr, momentum:c.momentum },
    createdAt:'2026-10-08T00:40:00+08:00'
  };
  base.fingerprint=fingerprintOf(base);
  return base;
}

VIEWS.base=()=>{
  const T=Object.fromEntries(BNODES.map(n=>[n[0],{x:n[1],y:n[2],w:n[3],h:n[4]}]));
  let g='';
  BEDGES.forEach(e=>{
    const A=T[e[0]],B=T[e[1]];
    const x1=A.x+A.w,y1=A.y+A.h/2,x2=B.x,y2=B.y+B.h/2,mx=(x1+x2)/2;
    g+=`<path class="te${e[3]==='fork'?' fork':''}${e[3]==='p'?' p':''}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`;
    g+=`<text class="tel" x="${mx}" y="${(y1+y2)/2-5}" text-anchor="middle">${e[2]}</text>`;
  });
  BNODES.forEach(n=>{
    const sel = n[5]==='zh-lora-v2' ? ' sel':'';
    g+=`<g class="tn${sel}" data-b="${n[0]}"><rect x="${n[1]}" y="${n[2]}" width="${n[3]}" height="${n[4]}" rx="9"
      fill="${n[6]}" stroke="${n[7]}" stroke-width="1"/><text x="${n[1]+12}" y="${n[2]+21}">${n[5]}</text>
      <text class="sub" x="${n[1]+12}" y="${n[2]+37}">${n[6+2]?n[8]:n[8]}</text></g>`;
  });
  return `
  <h2 class="sec">模型不是文件，是一棵树 —— 选一个 check 当起点</h2>
  <div class="gwrap"><svg class="tree" viewBox="0 0 800 330">${g}</svg></div>

  <h2 class="sec">当前选中的起点（会被锁进新房间的 manifest）</h2>

    <div class="kv"><span>起点 check</span><b id="baseSel">${S.base}</b></div>
    <div class="kv"><span>继承的验收套件</span><b>eval-suite-A（继承保证跨分支分数可比）</b></div>
    <div class="kv"><span>继承的字符表</span><b>由起点 + 数据共同决定，写进指纹</b></div>

    继承验收套件是为了让不同分支的分数<b>可比</b>。</div>`;

    </div>`

function shardPreview(){
  const c=S.cfg, n=c.shards, blocks=24;
  let out='<div class="mono" style="font-size:10px;line-height:1.9;color:var(--dim)">';
  for(let i=0;i<blocks;i++){
    const owner = c.shardMode==='interleave' ? (i%n) : Math.min(n-1,Math.floor(i/n*1));
    const col=c.shardMode==='interleave' ? ['#7f77dd','#5dcaa5','#85b7eb','#ef9f27','#97c459','#d4537e','#e24b4a','#afa9ec'][owner%8]
                                         : ['#7f77dd','#5dcaa5','#85b7eb','#ef9f27','#97c459','#d4537e','#e24b4a','#afa9ec'][owner%8];
    out+=`<span style="color:${col}">█</span>`;
  }
  out+='</div>';
  out+= c.shardMode==='interleave'
    ? '<div class="note">交错：每个节点都拿到"各文体的混合"，分布接近全集。</div>'
    : '<div class="note">连续：节点各拿一段 —— 各节点看到不同文体配比，正是 non-IID 最坏情形。</div>';
  return out;
}

    L.push(S.cfg.crossCheck
      ? 'verify: <span class="g">真复算</span> probeEvalCount='+S.cfg.probeEvalCount+' · 容差 '+S.cfg.verifyTol
      : 'verify: <span class="w">crossCheck=false ⇒ 直接返回 ok，不做复算</span>');
    L.push('<span class="e">v-bad-11 自报 probeLoss=4.39，复算 3.41，Δ=0.98 &gt; 1e-3 ⇒ verdict=suspect，本轮剔除</span>');
  }
  if(TP>=5) L.push('aggregateGlobal(base, accepted, sizes) —— <span class="w">注意：fedAvg 无 steps 参数 ⇒ 步数归一化(FedNova)未实现</span>');
  if(TP>=6) L.push('setWeights(global) · evalProbe(256条) → probeLoss=3.38');
  if(TP>=7) L.push('encodeWeights(global) → magic '+MAGIC+' · 帧 '+frameBytes(params()).toLocaleString()+' B · digest=fnv1a');
  if(TP>=8) L.push('<span class="k">broadcastBinary</span> 背压发送 DC_HIGH_WATER=512KB CHUNK=16KB');
  if(TP>=9) L.push('<span class="k">round/close</span> stats={round,globalLoss,prevGlobalLoss,online,aggregated,bytes,elapsedMs}');
  L.push('v-mobile-07 心跳恢复 → 下一轮自动加入（<span class="g">弹性成员，掉线不阻塞</span>，MAX_MISSES=3）');
  return L.join('\n');
}
AFTER.train=()=>{
  const t=document.getElementById('tick'); if(t) t.addEventListener('click',()=>{TP=TP%9+1;render();});
  const n=document.getElementById('nextRound'); if(n) n.addEventListener('click',()=>{S.round=Math.min(S.cfg.rounds,S.round+1);TP=1;toast('进入第 '+S.round+' 轮');render();});
  const k=document.getElementById('killOne'); if(k) k.addEventListener('click',()=>toast('已注入一次掉线：v-mobile-07 被切后台，本轮 verdict=timeout，训练不中断。'));
};
